services:
  user-database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    volumes:
      - user-database-data:/var/lib/postgresql/data
      - ./user-service/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: user-database
      DB_PORT: ${USER_DB_PORT}
      DB_USER: ${USER_DB_USER}
      DB_PASSWORD: ${USER_DB_PASSWORD}
      DB_NAME: ${USER_DB_NAME}
      DB_SSLMODE: ${USER_DB_SSLMODE}
      GRPC_PORT: ${USER_SERVICE_GRPC_PORT}
    depends_on:
      user-database:
        condition: service_healthy

  catalog-database:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
      POSTGRES_DB: ${CATALOG_DB_NAME}
    volumes:
      - catalog-database-data:/var/lib/postgresql/data
      - ./catalog-service/init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      DB_URL: user=${CATALOG_DB_USER} password=${CATALOG_DB_PASSWORD} host=catalog-database port=${CATALOG_DB_PORT} dbname=${CATALOG_DB_NAME} sslmode=${CATALOG_DB_SSLMODE}
      GRPC_PORT: ${CATALOG_SERVICE_GRPC_PORT}
    depends_on:
      catalog-database:
        condition: service_healthy

  orders-database:
    image: mongo:latest
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - orders-database-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-init:
    image: mongo:latest
    restart: "no"
    command: >
      bash -c "
        sleep 5;
        mongosh --host orders-database:27017 --eval '
          try {
            rs.status();
            print(\"Replica set already exists\");
          } catch (e) {
            print(\"Initiating replica set...\");
            rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"orders-database:27017\" }] });
            print(\"Replica set initiated.\");
          }
        '
      "
    depends_on:
      orders-database:
        condition: service_healthy

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  orders-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://orders-database:27017/?replicaSet=rs0
      - ORDERS_DB_PORT=27017
      - PORT=${ORDERS_SERVICE_GRPC_PORT}
      - CATALOG_SERVICE_ADDR=${CATALOG_SERVICE_ADDR}
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC_ORDER_CREATED=foodrush.orders.created
      - KAFKA_TOPIC_PAYMENT_PROCESSED=foodrush.payments.processed
      - KAFKA_TOPIC_PAYMENT_FAILED=foodrush.payments.failed
      - KAFKA_CONSUMER_GROUP=orders-service-payments-consumer
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  payment-database:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PAYMENT_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
      POSTGRES_DB: ${PAYMENT_DB_NAME}
    volumes:
      - payment-database-data:/var/lib/postgresql/data
      - ./payment-service/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  payments-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: ${PAYMENT_DB_HOST}
      DB_PORT: ${PAYMENT_DB_PORT}
      DB_USER: ${PAYMENT_DB_USER}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      DB_NAME: ${PAYMENT_DB_NAME}
      PORT: ${PAYMENTS_SERVICE_GRPC_PORT}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_ORDER_CREATED: foodrush.orders.created
      KAFKA_TOPIC_PAYMENT_PROCESSED: foodrush.payments.processed
      KAFKA_TOPIC_PAYMENT_FAILED: foodrush.payments.failed
      KAFKA_CONSUMER_GROUP: payments-service
    # healthcheck:
    #   test: ["CMD", "grpc-health-probe", "-addr=:${PAYMENTS_SERVICE_GRPC_PORT}"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 10s
    depends_on:
      payment-database:
        condition: service_healthy
      kafka:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "${API_GATEWAY_PORT}:8080"
    environment:
      API_GATEWAY_PORT: 8080
      USER_SERVICE_ADDR: ${USER_SERVICE_ADDR}
      CATALOG_SERVICE_ADDR: ${CATALOG_SERVICE_ADDR}
      ORDERS_SERVICE_ADDR: ${ORDERS_SERVICE_ADDR}
      PAYMENTS_SERVICE_ADDR: ${PAYMENTS_SERVICE_ADDR}
    depends_on:
      user-service:
        condition: service_started
      catalog-service:
        condition: service_started
      orders-service:
        condition: service_started
      payments-service:
        condition: service_started

volumes:
  user-database-data:
  catalog-database-data:
  orders-database-data:
  payment-database-data:
